name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 核心口径自检
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Node（网格链路断言需要）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 语法检查（9 个脚本）
        run: python -m py_compile scripts/*.py

      - name: 文本控制字符检查（防止行内代码被转义吃掉首字符）
        run: node tools/check-text.mjs

      - name: 核心计算自检（48 条断言）
        run: python scripts/site_core.py selftest

      - name: 网格评分自检（17 条纯函数断言，不联网）
        run: python scripts/grid-scan.py --self-test

      # 网格链路端到端：夹具 → 打分 → 30 条断言。
      # 三步显式串起来，任一步非零即整 job 失败；不设 continue-on-error、不设 || true。
      - name: 网格测试夹具（生成 out/grid，0 次接口调用）
        run: node tools/fixtures/make-grid-pool.mjs

      - name: 网格候选评分（--rescore，0 次接口调用）
        run: python scripts/grid-scan.py --city 广州 --district 天河 --rescore

      - name: 网格链路断言（30 条）
        run: node tools/test-grid.mjs

      - name: 业态规则可加载
        run: python scripts/site_core.py formats

      - name: 基准库与参数文件为合法 JSON
        run: |
          python - <<'PY'
          import json, glob, sys
          files = ['manifest.json', '.codebuddy-plugin/plugin.json'] + \
                  glob.glob('data/*.json') + glob.glob('params/*.json')
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8-sig'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          print(f'检查 {len(files)} 个 JSON 文件')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('全部合法')
          PY

      - name: 财务口径回归（关键数字）
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import site_core as sc

          p = {"daily_revenue": 30000, "gross_margin": 0.62, "monthly_rent": 120000,
               "monthly_labor": 150000, "monthly_other_fixed": 40000,
               "initial_investment": 3200000}
          r = sc.finance(p, area=1200, space={"avg_ticket": 230},
                         catchment="L2", code="large_yuecai")
          b = r["per_scenario"]["base"]

          checks = [
              ("营收 990000", abs(b["revenue"] - 990000) < 1),
              ("现金净流 259250", abs(b["monthly_cash_flow"] - 259250) < 1),
              ("会计净利 205916.67", abs(b["net_profit"] - 205916.67) < 1),
              ("现金回本 12.3 月", abs(b["payback_static_months"] - 12.3) < 0.05),
              ("会计回本 15.5 月", abs(b["accounting_payback_months"] - 15.5) < 0.05),
              ("极限租金保本 379250", abs(b["max_rent_breakeven"] - 379250) < 1),
              # v2.10.26 起锚点取基准档；186165.34 是保守档值，改由下一条断言保护
              ("锚点（基准档） 290361.11", abs(r["recommendation"]["target_rent"] - 290361.11) < 1),
              ("保守档压力下限 186165.34", abs(r["recommendation"]["target_rent_conservative"] - 186165.34) < 1),
              ("保本红线（基准档） 379250", abs(r["recommendation"]["ceiling_rent"] - 379250) < 1),
              ("座位 278", r["space_model"]["seats"] == 278),
          ]

          # 敏感度档位一致：四行 anchor_base 必须都等于 recommendation.target_rent（同走 base 档）。
          # v2.10.36 之前两端扰动取 pessimistic、基准列取 base，同一张表混两个档，跨引擎比对才抓得到。
          sens = r.get("sensitivity") or []
          if not sens:
              print("FAIL  敏感度表缺失：finance().sensitivity 为空")
              sys.exit(1)
          anchor_base_vals = [row.get("anchor_base") for row in sens]
          tgt = r["recommendation"]["target_rent"]
          checks.append(("敏感度 4 行 anchor_base 均等于 target_rent",
                         all(v is not None and abs(v - tgt) < 0.01 for v in anchor_base_vals)))

          fail = [n for n, ok in checks if not ok]
          for n, ok in checks:
              print(('PASS  ' if ok else 'FAIL  ') + n)
          sys.exit(1 if fail else 0)
          PY

      - name: 多城市支持（无数据时不静默兜底）
        run: |
          python - <<'PY'
          import sys, json
          sys.path.insert(0, 'scripts')
          import site_core as sc

          # 有基准的城市
          ok = sc.benchmark("上海", "本帮菜", area=600, rent_wan=9, ticket=120)
          assert ok.get("matched") is True, "上海应能对标"
          print("PASS  上海可对标")

          # 无基准的城市：必须明确报错，不得套用其他城市
          miss = sc.benchmark("济南", "鲁菜", area=800)
          assert miss.get("city_in_benchmark") is False, "济南应报无基准"
          assert miss.get("available_cities"), "应列出可用城市"
          print("PASS  济南正确报无基准，未静默兜底")
          PY

  # ── 跨链路契约测试：TS 引擎与 Python 引擎必须给出同一答案 ──────────────
  # 为什么单独一个 job：Python 侧不需要 Node，TS 侧需要 Node + 运行时依赖，
  # 分开跑能让失败原因一眼可辨（是口径分裂，还是依赖装不上）。
  cross-chain-parity:
    name: 跨链路契约测试（TS ↔ Python）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 TS 引擎运行时依赖
        # @deepseek-ai/dsh-tools 是 site-tools.ts 的**运行时**依赖（值导入），
        # 不是类型档；本包 package.json 未声明它，故显式安装且不改写 package.json。
        # 用官方 registry：npmmirror 镜像滞后，只有 0.0.1-rc.1，装不到 0.1.0-rc.x。
        run: |
          npm install --no-save --registry=https://registry.npmjs.org \
            @deepseek-ai/dsh-tools@^0.1.0-rc.7 \
            @deepseek-ai/cordis@^4.0.1

      - name: 契约测试（136 项字段比对）
        run: node tools/test-parity.mjs
