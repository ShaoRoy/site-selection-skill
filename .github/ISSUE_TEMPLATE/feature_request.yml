name: 能力需求（新增业态 / 指标 / 数据源适配）
description: 想要新增的业态规则、计算指标、城市适配或宿主接入。请说明现有能力卡在哪一步，而不是只写想要什么。
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的边界是**可复算的选址分析**：能写成公式 + 断言 + 可追溯字段的，才收；
        「预测这家店能不能赚钱」这类不可验证的判断，不做。

        提之前请先在 README「核心能力」与 `references/` 里确认现有能力边界 —— 很多需求是靠现有参数组合能表达的。
  - type: dropdown
    id: kind
    attributes:
      label: 需求类型
      options:
        - 业态规则（新增行业参数 / 基准）
        - 计算指标（财务 / 网格评分 / 空间分析）
        - 数据源适配（高德 / 腾讯的字段与配额差异）
        - 城市 / 区域适配
        - 宿主接入（新 Agent 平台）
        - 报告与渲染
        - 其他
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 谁在什么环节用、替代现在的什么做法；尽量给一条真实输入
      placeholder: |
        场景：
        现在怎么做的：
        期望输入 / 输出：
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: 现有能力卡在哪
      description: 指出具体脚本、参数或报告段，说明是缺参数、缺字段还是口径不适用
      placeholder: |
        相关脚本：
        卡点：
    validations:
      required: true
  - type: textarea
    id: formula
    attributes:
      label: 可计算性（能写成公式吗）
      description: 若能给出公式、单位、默认值来源与边界条件；不能给出也没关系，写清为什么
      placeholder: |
        公式：
        单位：
        默认值来源：
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已在 README 核心能力 / references 中确认现有实现无法覆盖
          required: true
        - label: 不涉及新增 OSM 或其他 POI 数据源（POI 双源固定为高德 + 腾讯）
          required: true
        - label: 理解「缺参数不出财务段」：新指标若缺基准，需接受先进《待确认的假设》台账
          required: true
