name: Bug 报告（计算 / 采集 / 报告 / 安装）
description: 脚本报错、数字对不上、报告缺段、宿主装不上。请按要求贴 selftest 输出与复现命令，否则无法定位。
title: "[bug] "
labels: ["needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先跑四项自检，**在含 `scripts/` 的目录下执行**（即本 SKILL.md 所在目录）：

        ```bash
        cd <本 SKILL.md 所在目录>
        python scripts/site_core.py selftest
        python scripts/site_core.py formats
        python scripts/grid-scan.py --self-test
        python scripts/grid-registry.py --self-test
        ```

        期望：48/48、业态规则可加载、17/17、12/12。四项都过仍出问题，再往下填。

        只做财务测算的问题**不需要任何 API Key**；涉及采集的请说明 Key 是否已配 —— **不要贴 Key 本身**。
  - type: dropdown
    id: host
    attributes:
      label: 运行宿主
      description: 装在哪一类环境里跑的
      options:
        - WorkBuddy（01 技能包）
        - DeepSeek Harness（03 源码包 / 完整工作区）
        - Claude Code / claude.ai
        - 其他 Agent（Cursor / Trae / Qoder / 扣子 / Dify / 自建 function calling）
        - 纯命令行，不经 Agent
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 取 manifest.json 的 version 字段，或 git tag
      placeholder: "2.10.52"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + Python 版本；渲染链 / 网格链路问题再补 Node 版本
      placeholder: "Windows 11 26100 / Python 3.11.9 / Node 22.11.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现命令
      description: 完整命令，含全部参数，多步按顺序贴；不要写「跑了 finance 就报错」
      render: bash
      placeholder: |
        python scripts/site_core.py finance --rent 180000 --area 1200 ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 期望结果 vs 实际结果
      description: 期望写口径来源（公式 / references 里的哪一节）；实际贴原始输出，错误栈保留前 30 行与最后 5 行
      placeholder: |
        期望（口径来源：references/02-...）：

        实际：
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: selftest 输出（尾部 20 行）
      description: 不贴这段基本无法定位；四条命令的结论行贴全更好
      render: shell
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据片段（可选，务必脱敏）
      description: 相关的 probe.json / out/grid 缓存片段；先删掉 Key、cookie、内网地址
      render: json
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已检索现有 issue 与 CHANGELOG，确认不是已知问题
          required: true
        - label: 输出中已删除 API Key、cookie、内网地址等敏感信息
          required: true
        - label: 这是可复现的技术问题，不是「这个店能不能开」类经营判断（后者不在本项目范围）
          required: true
